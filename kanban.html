<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agentim — Kanban Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0a; --ink:#fafafa; --sec:#d4d4d4; --mut:#737373; --faint:#525252;
  --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.06);
  /* monochrome: accent is a soft silver/white, not a color */
  --accent:#ffffff;
  --amber:#8a8a8a; --blue:#b4b4b4; --green:#ffffff;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:24px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.sub{color:var(--mut);font-size:13px;margin-top:5px;font-family:var(--mono)}

.stage{position:relative;border:1px solid var(--border);border-radius:12px;
  background:linear-gradient(180deg,#0c0c0c,#080808);height:min(64vh,580px);
  overflow:hidden;margin-top:20px}
.phead{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border2);
  font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em;z-index:20;
  background:rgba(8,8,8,.55);backdrop-filter:blur(8px)}
.phead .live{display:flex;align-items:center;gap:7px;color:var(--sec)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.corner{position:absolute;width:9px;height:9px;z-index:15}
.corner.tl{top:8px;left:8px;border-top:1px solid var(--border);border-left:1px solid var(--border)}
.corner.tr{top:8px;right:8px;border-top:1px solid var(--border);border-right:1px solid var(--border)}
.corner.bl{bottom:8px;left:8px;border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
.corner.br{bottom:8px;right:8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}

/* board */
.board{position:absolute;inset:40px 0 0 0;padding:20px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;height:100%}
.col{position:relative;border:1px solid var(--border2);border-radius:10px;background:rgba(255,255,255,0.012);
  min-width:0;display:flex;flex-direction:column}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--mut);
  border-bottom:1px solid var(--border2)}
.col-h .name{display:flex;align-items:center;gap:7px}
.col-h .swatch{width:7px;height:7px;border-radius:2px}
.col:nth-child(1) .swatch{background:var(--mut)}
.col:nth-child(2) .swatch{background:var(--amber)}
.col:nth-child(3) .swatch{background:var(--blue)}
.col:nth-child(4) .swatch{background:var(--accent)}
.col:nth-child(4) .name{color:var(--accent)}
.col-h .count{color:var(--faint)}
.col-body{position:relative;flex:1;padding:10px;overflow:hidden}

/* cards live in a single absolute layer so they glide across columns */
.cardlayer{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:0;top:0;border-radius:8px;
  background:#141414;border:1px solid rgba(255,255,255,0.1);
  padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.4);
  transition:transform .62s cubic-bezier(.22,.61,.16,1), opacity .35s ease, box-shadow .3s, border-color .3s;
  will-change:transform,opacity}
.card.moving{box-shadow:0 10px 26px -6px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.55);
  border-color:rgba(255,255,255,.5);z-index:10}
.card.enter{opacity:0;transform:translate(var(--x),calc(var(--y) + 10px)) scale(.96)}
.card.done{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.045)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.card .dept{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--sec);
  border:1px solid var(--border);border-radius:3px;padding:2px 5px;background:rgba(255,255,255,.03)}
.card .tid{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.02em;margin-left:auto}
.card .title{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border2)}
.card .ava{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;
  border:1px solid var(--border);filter:grayscale(1) contrast(1.02);background:#1c1c1c}
.card .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.card .who .nm{font-size:11px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .who .role{font-family:var(--mono);font-size:8.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .chk{margin-left:auto;color:var(--ink);font-size:11px;opacity:0;transition:opacity .3s;flex:none}
.card.done .chk{opacity:1}

/* mobile: keep ALL 4 columns visible, just tighter */
@media (max-width:640px){
  body{padding:12px}
  .board{padding:10px}
  .cols{gap:6px}
  .col-h{padding:8px 6px 7px;font-size:8px;letter-spacing:.02em}
  .col-h .name{gap:4px}
  .col-h .swatch{width:5px;height:5px}
  .col-body{padding:5px}
  .card{padding:6px 6px}
  .card .top{gap:4px;margin-bottom:4px}
  .card .dept{font-size:6.5px;padding:1px 3px;letter-spacing:.04em}
  .card .tid{font-size:6.5px}
  .card .title{font-size:9px;-webkit-line-clamp:2;line-height:1.25}
  .card .foot{gap:5px;margin-top:6px;padding-top:5px}
  .card .ava{width:18px;height:18px}
  .card .who .nm{font-size:8px}
  .card .who .role{font-size:6.5px}
}
.steps{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Agentim — Kanban hero (Trello-style, self-driving)</h1>
  <div class="sub">/// cards move themselves through the flow · precise DOM motion · resize to test phone</div>

  <div class="stage" id="stage">
    <div class="phead">
      <span>AGENT BOARD /// AUTONOMOUS</span>
      <span class="live"><span class="dot"></span> LIVE</span>
    </div>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="steps" id="steps"></div>
    <div class="board">
      <div class="cols" id="cols"></div>
      <div class="cardlayer" id="cardlayer"></div>
    </div>
  </div>
</div>

<script>
const COLS=[
  {key:'BACKLOG', color:'var(--mut)'},
  {key:'IN PROGRESS', color:'var(--amber)'},
  {key:'REVIEW', color:'var(--blue)'},
  {key:'DONE', color:'var(--accent)'},
];
// a full self-operating AI company: each "employee" is an AI agent with a role.
// Real face photos (pravatar), rendered as grayscale circular avatars.
const ROSTER=[
  {name:'Dana Levi',    role:'General Counsel · AI',  dept:'LEGAL',     img:47},
  {name:'Omar Haddad',  role:'Growth Lead · AI',      dept:'MARKETING', img:12},
  {name:'Mia Chen',     role:'Staff Engineer · AI',   dept:'ENGINEERING',img:5},
  {name:'Leo Novak',    role:'SRE Lead · AI',         dept:'DEVOPS',    img:33},
  {name:'Sara Kohn',    role:'CISO · AI',             dept:'SECURITY',  img:16},
  {name:'Ivan Petrov',  role:'Controller · AI',       dept:'FINANCE',   img:52},
  {name:'Aya Tanaka',   role:'Research Lead · AI',    dept:'RESEARCH',  img:44},
  {name:'Noah Adler',   role:'Product Manager · AI',  dept:'PRODUCT',   img:60},
];
// tasks that read like a company running itself, keyed to each department
const TASKS_BY_DEPT={
  LEGAL:      ['review SaaS vendor contract','file Agentim trademark','draft DPA for new client','redline NDA — clause 7'],
  MARKETING:  ['draft Q3 launch campaign','A/B test pricing page','publish changelog post','plan webinar funnel'],
  ENGINEERING:['ship agent-routing v2','fix token refresh bug','review PR #418','add rate-limit guard'],
  DEVOPS:     ['roll out canary deploy','scale inference cluster','rotate prod secrets','tune autoscaler'],
  SECURITY:   ['patch CVE-2026-1183','run quarterly access audit','Zero-Trust policy review','revoke stale API keys'],
  FINANCE:    ['reconcile monthly invoices','approve cloud budget','issue client invoice #204','close the books — June'],
  RESEARCH:   ['benchmark new model','summarize competitor launch','evaluate RAG recall','draft research memo'],
  PRODUCT:    ['spec onboarding flow','triage feature requests','write release notes','review usage metrics'],
};
const SDOT=['var(--mut)','var(--amber)','var(--blue)','var(--accent)'];

const colsEl=document.getElementById('cols');
const layer=document.getElementById('cardlayer');
const stepsEl=document.getElementById('steps');
let cards=[];   // {id,col,slot,el,title,agent,tid,born}
let seq=1000;
let mobile=window.innerWidth<=640;
let mView=0;

// build column shells (all 4 always visible)
function buildCols(){
  colsEl.innerHTML='';
  COLS.forEach((c,i)=>{
    const col=document.createElement('div');
    col.className='col';
    col.dataset.i=i;
    col.innerHTML=`<div class="col-h"><span class="name"><span class="swatch"></span>${c.key}</span><span class="count" data-c="${i}">0</span></div><div class="col-body"></div>`;
    colsEl.appendChild(col);
  });
}

function colRect(i){
  const col=colsEl.querySelector(`.col[data-i="${i}"]`);
  if(!col) return null;
  const body=col.querySelector('.col-body');
  const br=body.getBoundingClientRect();
  const lr=layer.getBoundingClientRect();
  return {x:br.left-lr.left, y:br.top-lr.top, w:br.width, h:br.height};
}

function cardH(){ return mobile?48:74; }
function gap(){ return mobile?6:10; }

function layout(animate){
  // group by column, order by slot
  const byCol={0:[],1:[],2:[],3:[]};
  cards.forEach(c=>byCol[c.col].push(c));
  Object.keys(byCol).forEach(ci=>{
    byCol[ci].sort((a,b)=>a.born-b.born);
    const r=colRect(+ci);
    if(!r) return;
    // pass 1: lock each card's width so wrapping (and height) is correct
    byCol[ci].forEach(c=>{ c.el.style.width=r.w+'px'; });
    // pass 2: stack using measured real heights
    let cursor = 0;
    byCol[ci].forEach((c,idx)=>{
      const x=r.x, y=r.y+cursor;
      const hh = (c.el.offsetHeight || cardH());
      cursor += hh + gap();
      c.el.style.setProperty('--x', x+'px');
      c.el.style.setProperty('--y', y+'px');
      c.el.style.transform=`translate(${x}px,${y}px)`;
      c.el.style.opacity = (y + hh > r.h + 4) ? '0' : '1';
      c.el.style.pointerEvents='none';
    });
    // count
    const cnt=colsEl.querySelector(`.count[data-c="${ci}"]`);
    if(cnt) cnt.textContent=byCol[ci].filter(c=>true).length;
  });
}

function makeCard(){
  const id='c'+(seq++);
  const person=ROSTER[Math.floor(Math.random()*ROSTER.length)];
  const pool=TASKS_BY_DEPT[person.dept];
  const title=pool[Math.floor(Math.random()*pool.length)];
  const tid=person.dept.slice(0,3)+'-'+Math.floor(100+Math.random()*900);
  const el=document.createElement('div');
  el.className='card enter';
  el.innerHTML=`<div class="top"><span class="dept">${person.dept}</span><span class="tid">${tid}</span></div>
    <div class="title">${title}</div>
    <div class="foot"><img class="ava" src="https://i.pravatar.cc/64?img=${person.img}" alt="" loading="eager"><span class="who"><span class="nm">${person.name}</span><span class="role">${person.role}</span></span><span class="chk">✓</span></div>`;
  layer.appendChild(el);
  const img=el.querySelector('.ava');
  if(img) img.addEventListener('load',()=>layout(true),{once:true});
  const c={id,col:0,el,title,agent:person.name,tid,born:performance.now()+Math.random()};
  cards.push(c);
  layout(false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.classList.remove('enter'); layout(true); }));
  return c;
}

function advance(c){
  if(c.col>=3) return;
  c.col++;
  c.born=performance.now(); // re-stamp so it lands at bottom of new column
  const sdot=c.el.querySelector('.sdot');
  sdot.style.background=SDOT[c.col];
  c.el.classList.add('moving');
  if(c.col===3) c.el.classList.add('done');
  layout(true);
  setTimeout(()=>c.el.classList.remove('moving'), 650);
}

function tick(){
  const now=performance.now();
  // advance a random eligible card
  const movable=cards.filter(c=>c.col<3 && now-c.born>1200);
  if(movable.length){
    const c=movable[Math.floor(Math.random()*movable.length)];
    advance(c);
  }
  // retire done cards after a beat
  cards.filter(c=>c.col===3).forEach(c=>{
    if(now-c.born>2600 && !c.retiring){
      c.retiring=true;
      c.el.style.opacity='0';
      c.el.style.transform=c.el.style.transform+' scale(.95)';
      setTimeout(()=>{ c.el.remove(); cards=cards.filter(x=>x!==c); layout(true); }, 400);
    }
  });
  // keep the board populated
  const active=cards.filter(c=>!c.retiring).length;
  if(active<(mobile?7:10) && Math.random()<0.7) makeCard();
  setTimeout(tick, 700+Math.random()*700);
}

function onResize(){
  mobile=window.innerWidth<=640;
  buildCols();
  layout(true);
}
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(onResize,120); });

// init
buildCols();
for(let i=0;i<6;i++){ const c=makeCard(); c.col=Math.floor(Math.random()*3); c.el.querySelector('.sdot').style.background=SDOT[c.col]; }
layout(false);
setTimeout(()=>layout(true), 60);
setTimeout(tick, 900);
</script>
</body>
</html>
