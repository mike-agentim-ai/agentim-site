<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agentim — Team Boards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0a; --ink:#fafafa; --sec:#d4d4d4; --mut:#737373; --faint:#525252;
  --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.06);
  --accent:#ffffff;
  --queued:#8a8a8a; --working:#c9a227; --review:#5b9bd5; --done:#4fae74;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:24px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.sub{color:var(--mut);font-size:13px;margin-top:5px;font-family:var(--mono)}

.stage{position:relative;border:1px solid var(--border);border-radius:14px;
  background:linear-gradient(180deg,#0c0c0c,#080808);margin-top:20px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:44px;
  border-bottom:1px solid var(--border2);font-family:var(--mono);font-size:11px;color:var(--mut);
  letter-spacing:.06em;background:rgba(8,8,8,.55)}
.phead .live{display:flex;align-items:center;gap:7px;color:var(--sec)}
.dot{width:6px;height:6px;border-radius:50%;background:#4fae74;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* board grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:18px}
@media (max-width:820px){ .grid{grid-template-columns:1fr} }

.board{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.015);
  display:flex;flex-direction:column;overflow:hidden}
.b-head{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--border2);
  background:rgba(255,255,255,0.015)}
.b-lead{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
  border:1px solid var(--border)}
.b-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.b-team{font-size:14px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.b-team .tag{font-family:var(--mono);font-size:8.5px;font-weight:500;letter-spacing:.08em;color:var(--mut);
  border:1px solid var(--border);border-radius:3px;padding:2px 5px}
.b-lead-name{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:2px}
.b-stat{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;white-space:nowrap}

.tasks{display:flex;flex-direction:column;gap:8px;padding:12px}
.task{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border2);border-radius:9px;
  padding:10px 11px;background:#131313;
  transition:opacity .4s ease, transform .4s cubic-bezier(.22,.61,.16,1), border-color .3s;}
.task.enter{opacity:0;transform:translateY(8px)}
.task.leave{opacity:0;transform:translateY(-6px)}
.task .av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--border)}
.task .body{flex:1;min-width:0}
.task .t-title{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4}
.task .t-sub{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.task .who{font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;
  letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--sec)}
.pill .pd{width:5px;height:5px;border-radius:50%}
.pill.queued .pd{background:var(--queued)} .pill.working .pd{background:var(--working)}
.pill.review .pd{background:var(--review)} .pill.done .pd{background:var(--done)}
.pill.working{color:#e2c766} .pill.review{color:#9cc4ea} .pill.done{color:#8fd6ab}

.foot{padding:11px 18px;border-top:1px solid var(--border2);display:flex;align-items:center;
  justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint)}
.foot .mike{color:var(--sec)}
.foot .mike b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Agentim — Team boards (hire a team of AI agents)</h1>
  <div class="sub">/// each board is an autonomous AI team · a team lead reports to Mike · colored avatars · full text</div>

  <div class="stage">
    <div class="phead">
      <span>TEAM BOARDS /// AUTONOMOUS</span>
      <span class="live"><span class="dot"></span> LIVE</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <span>4 teams · self-operating</span>
      <span class="mike">team leads report to <b>Mike</b> — your AI chief of staff</span>
    </div>
  </div>
</div>

<script>
// Each board = an autonomous AI team, with a lead who reports to Mike.
const TEAMS=[
  {team:'Marketing', tag:'GROWTH', lead:{name:'Omar Haddad', role:'Team Lead · Growth AI', img:12},
   members:[{name:'Omar Haddad',img:12},{name:'Lia Frank',img:45},{name:'Ben Ori',img:15}],
   tasks:['Draft Q3 launch campaign','A/B test the pricing page','Publish product changelog','Plan the webinar funnel','Refresh landing copy']},
  {team:'Engineering', tag:'AI-SPEC', lead:{name:'Mia Chen', role:'Team Lead · Staff Engineer AI', img:5},
   members:[{name:'Mia Chen',img:5},{name:'Raj Patel',img:11},{name:'Tom Weiss',img:68}],
   tasks:['Ship agent-routing v2','Fix token refresh bug','Review PR #418','Add rate-limit guard','Write API docs']},
  {team:'DevOps', tag:'INFRA', lead:{name:'Leo Novak', role:'Team Lead · SRE AI', img:33},
   members:[{name:'Leo Novak',img:33},{name:'Ana Cruz',img:23},{name:'Kai Berg',img:51}],
   tasks:['Roll out canary deploy','Scale inference cluster','Rotate prod secrets','Tune the autoscaler','Patch base image']},
  {team:'Security', tag:'ZERO-TRUST', lead:{name:'Sara Kohn', role:'Team Lead · CISO AI', img:16},
   members:[{name:'Sara Kohn',img:16},{name:'Dana Levi',img:47},{name:'Yon Adar',img:60}],
   tasks:['Patch CVE-2026-1183','Run quarterly access audit','Zero-Trust policy review','Revoke stale API keys','Encrypt backups at rest']},
];
const STATUSES=[
  {k:'queued', label:'QUEUED'},
  {k:'working', label:'WORKING'},
  {k:'review', label:'REVIEW'},
  {k:'done', label:'DONE'},
];
const grid=document.getElementById('grid');
const pv=n=>`https://i.pravatar.cc/64?img=${n}`;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// build the boards
TEAMS.forEach((tm,ti)=>{
  const b=document.createElement('div'); b.className='board';
  b.innerHTML=`
    <div class="b-head">
      <img class="b-lead" src="${pv(tm.lead.img)}" alt="">
      <div class="b-meta">
        <div class="b-team">${tm.team}<span class="tag">${tm.tag}</span></div>
        <div class="b-lead-name">${tm.lead.name} — ${tm.lead.role}</div>
      </div>
      <div class="b-stat" data-stat="${ti}">3 active</div>
    </div>
    <div class="tasks" data-tasks="${ti}"></div>`;
  grid.appendChild(b);
  tm._el=b.querySelector(`[data-tasks="${ti}"]`);
  tm._stat=b.querySelector(`[data-stat="${ti}"]`);
  tm._live=[];
  // seed 3 tasks at varied statuses
  for(let i=0;i<3;i++) addTask(tm, Math.floor(rand(0,2)));
});

function addTask(tm, startStatus){
  const title=pick(tm.tasks);
  const who=pick(tm.members);
  const el=document.createElement('div'); el.className='task enter';
  const st=STATUSES[startStatus||0];
  el.innerHTML=`
    <img class="av" src="${pv(who.img)}" alt="">
    <div class="body">
      <div class="t-title">${title}</div>
      <div class="t-sub">
        <span class="pill ${st.k}"><span class="pd"></span><span class="lbl">${st.label}</span></span>
        <span class="who">${who.name}</span>
      </div>
    </div>`;
  tm._el.appendChild(el);
  const task={el, status:startStatus||0, pill:el.querySelector('.pill'), lbl:el.querySelector('.lbl'),
    next:performance.now()+rand(1800,3400)};
  tm._live.push(task);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('enter')));
  updateStat(tm);
}

function updateStat(tm){
  const active=tm._live.filter(t=>t.status<3).length;
  tm._stat.textContent=active+' active';
}

function advance(tm, task){
  task.status++;
  const st=STATUSES[task.status];
  task.pill.className='pill '+st.k;
  task.pill.innerHTML=`<span class="pd"></span><span class="lbl">${st.label}</span>`;
  if(task.status>=3){
    // completed — hold briefly, then remove and spawn a fresh queued task
    task.done=true;
    setTimeout(()=>{
      task.el.classList.add('leave');
      setTimeout(()=>{
        task.el.remove();
        tm._live=tm._live.filter(x=>x!==task);
        addTask(tm, 0);
      }, 380);
    }, rand(1400,2200));
  } else {
    task.next=performance.now()+rand(1800,3400);
  }
  updateStat(tm);
}

function loop(){
  const now=performance.now();
  TEAMS.forEach(tm=>{
    tm._live.forEach(task=>{
      if(!task.done && task.status<3 && now>=task.next) advance(tm, task);
    });
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
